services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_seo
      POSTGRES_USER: crm_seo
      POSTGRES_PASSWORD: crm_seo_dev_pw
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    depends_on:
      - db
    volumes:
      - ./backend:/app
    command: python manage.py run_daily_digest_scheduler

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  # Pinned to a fixed name (instead of the default "<folder-name>_db_data")
  # so the database always survives moving/renaming/re-cloning this project
  # folder — Compose otherwise derives the volume name from the folder it's
  # run from, and a rename silently creates a brand-new empty database.
  db_data:
    external: true
    name: crm-seo-claude-seo-project-crm-vdgc47_db_data
